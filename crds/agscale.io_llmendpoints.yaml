apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: llmendpoints.agscale.io
spec:
  group: agscale.io
  scope: Namespaced
  names:
    plural: llmendpoints
    singular: llmendpoint
    kind: LLMEndpoint
    shortNames:
      - llm
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                provider:
                  type: string
                  enum:
                    - openai
                    - azure-openai
                    - anthropic
                    - bedrock
                    - vllm
                    - ollama
                    - custom
                baseURL:
                  type: string
                defaultModel:
                  type: string
                auth:
                  type: object
                  properties:
                    secretRef:
                      type: object
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                      required:
                        - name
                        - key
                rateLimit:
                  type: object
                  properties:
                    requestsPerMinute:
                      type: integer
                    tokensPerMinute:
                      type: integer
                timeoutSeconds:
                  type: integer
                extraHeaders:
                  type: object
                  additionalProperties:
                    type: string
              required:
                - provider
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Provider
          type: string
          jsonPath: .spec.provider
        - name: Model
          type: string
          jsonPath: .spec.defaultModel
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
