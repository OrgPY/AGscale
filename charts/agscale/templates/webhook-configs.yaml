  {{- if .Values.webhook.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ .Values.webhook.certManager.certificateName }}
  {{- end }}
webhooks:
  - name: vagent.agscale.io
    sideEffects: None
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        namespace: {{ .Release.Namespace }}
        name: {{ include "agscale.fullname" . }}-webhook-service
        path: /validate-agscale-io-v1alpha1-agent
      {{- if not .Values.webhook.certManager.enabled }}
      caBundle: Cg==
      {{- end }}
    rules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: ["agscale.io"]
        apiVersions: ["v1alpha1"]
        resources: ["agents"]
  - name: vagentbudgetpolicy.agscale.io
    sideEffects: None
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        namespace: {{ .Release.Namespace }}
        name: {{ include "agscale.fullname" . }}-webhook-service
        path: /validate-agscale-io-v1alpha1-agentbudgetpolicy
      {{- if not .Values.webhook.certManager.enabled }}
      caBundle: Cg==
      {{- end }}
    rules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: ["agscale.io"]
        apiVersions: ["v1alpha1"]
        resources: ["agentbudgetpolicies"]
{{- end }}
