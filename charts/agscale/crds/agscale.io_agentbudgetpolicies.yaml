apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentbudgetpolicies.agscale.io
spec:
  group: agscale.io
  scope: Namespaced
  names:
    plural: agentbudgetpolicies
    singular: agentbudgetpolicy
    kind: AgentBudgetPolicy
    shortNames:
      - abp
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                scope:
                  type: string
                  enum:
                    - Agent
                    - Namespace
                targetRef:
                  type: object
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                window:
                  type: object
                  properties:
                    mode:
                      type: string
                      enum:
                        - Rolling24h
                limits:
                  type: object
                  properties:
                    maxRequests24h:
                      type: integer
                    maxTokens24h:
                      type: integer
                    maxEstimatedCostUSD24h:
                      type: number
                usageSources:
                  type: object
                  properties:
                    metrics:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                    providers:
                      type: array
                      items:
                        type: object
                        properties:
                          type:
                            type: string
                evaluation:
                  type: object
                  properties:
                    intervalSeconds:
                      type: integer
                    staleAfterSeconds:
                      type: integer
                alerting:
                  type: object
                  properties:
                    emitK8sEvents:
                      type: boolean
                    setConditions:
                      type: boolean
                    labels:
                      type: object
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                lastEvaluatedTime:
                  type: string
                  format: date-time
                windowStartTime:
                  type: string
                  format: date-time
                effectiveUsage:
                  type: object
                  properties:
                    requests24h:
                      type: integer
                    tokens24h:
                      type: integer
                    estimatedCostUSD:
                      type: number
                effectiveLimits:
                  type: object
                  properties:
                    maxRequests24h:
                      type: integer
                    maxTokens24h:
                      type: integer
                    maxEstimatedCostUSD24h:
                      type: number
                phase:
                  type: string
                  enum:
                    - WithinBudget
                    - Exceeded
                    - Unknown
                reason:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Scope
          type: string
          jsonPath: .spec.scope
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
