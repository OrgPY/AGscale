apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: memorystores.agscale.io
spec:
  group: agscale.io
  scope: Namespaced
  names:
    plural: memorystores
    singular: memorystore
    kind: MemoryStore
    shortNames:
      - mem
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - redis
                    - postgres
                    - qdrant
                    - milvus
                    - pinecone
                    - custom
                connection:
                  type: object
                  properties:
                    secretRef:
                      type: object
                      properties:
                        name:
                          type: string
                      required:
                        - name
                    endpoint:
                      type: string
                    database:
                      type: string
                retention:
                  type: object
                  properties:
                    ttlSeconds:
                      type: integer
                    maxItemsPerAgent:
                      type: integer
                consistency:
                  type: object
                  properties:
                    durability:
                      type: string
                    replicationFactor:
                      type: integer
              required:
                - type
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: .spec.type
        - name: Endpoint
          type: string
          jsonPath: .spec.connection.endpoint
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
