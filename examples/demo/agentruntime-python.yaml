apiVersion: agscale.io/v1alpha1
kind: AgentRuntime
metadata:
  name: python-fastapi-runtime
spec:
  image: ghcr.io/example/agent-runtime-python:0.1.0
  imagePullPolicy: IfNotPresent
  ports:
    - name: http
      containerPort: 8080
  readinessProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
  livenessProbe:
    httpGet:
      path: /livez
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 20
