apiVersion: agscale.io/v1alpha1
kind: AgentBudgetPolicy
metadata:
  name: moltbot-budget
spec:
  scope: Agent
  targetRef:
    name: moltbot
  window:
    mode: Rolling24h
  limits:
    maxRequests24h: 25000
    maxTokens24h: 5000000
    maxEstimatedCostUSD24h: 75
  usageSources:
    metrics:
      enabled: true
  evaluation:
    intervalSeconds: 60
    staleAfterSeconds: 315360000
  alerting:
    emitK8sEvents: true
    setConditions: true
