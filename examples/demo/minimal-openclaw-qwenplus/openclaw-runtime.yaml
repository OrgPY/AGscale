apiVersion: agscale.io/v1alpha1
kind: AgentRuntime
metadata:
  name: openclaw-runtime-minimal
spec:
  image: openclaw/openclaw:latest
  imagePullPolicy: IfNotPresent
  env:
    - name: CLAWDBOT_GATEWAY_TOKEN
      valueFrom:
        secretKeyRef:
          name: openclaw-gateway
          key: token
    - name: MOLTBOT_CONFIG_PATH
      value: /etc/moltbot/application.yaml
  ports:
    - name: gateway
      containerPort: 18789
    - name: control
      containerPort: 18790
  volumes:
    - name: openclaw-state
      emptyDir: {}
    - name: openclaw-config
      configMap:
        name: openclaw-config
        items:
          - key: application.yaml
            path: application.yaml
  volumeMounts:
    - name: openclaw-state
      mountPath: /data
    - name: openclaw-config
      mountPath: /etc/moltbot
      readOnly: true
  readinessProbe:
    tcpSocket:
      port: 18789
    initialDelaySeconds: 10
    periodSeconds: 10
  livenessProbe:
    tcpSocket:
      port: 18789
    initialDelaySeconds: 20
    periodSeconds: 20
