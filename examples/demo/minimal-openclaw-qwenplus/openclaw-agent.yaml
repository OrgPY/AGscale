apiVersion: agscale.io/v1alpha1
kind: Agent
metadata:
  name: openclaw-qwenplus-agent
spec:
  runtimeRef:
    name: openclaw-runtime-minimal
  llmEndpointRef:
    name: openclaw-qwenplus
  replicas: 1
  env:
    - name: AGENT_PROFILE
      value: openclaw-minimal
    - name: AGENT_MODE
      value: openclaw
  service:
    enabled: true
    port: 80
    targetPort: 18789
    type: ClusterIP
