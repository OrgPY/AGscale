apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - llmendpoint-qwen.yaml
patches:
  - path: patch-agent-clawdbot-qwen.yaml
    target:
      group: agscale.io
      version: v1alpha1
      kind: Agent
      name: clawdbot
  - path: patch-agent-moltbot-qwen.yaml
    target:
      group: agscale.io
      version: v1alpha1
      kind: Agent
      name: moltbot
