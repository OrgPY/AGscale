apiVersion: agscale.io/v1alpha1
kind: Agent
metadata:
  name: qwen-vectorengine-agent
spec:
  runtimeRef:
    name: qwen-runtime-minimal
  llmEndpointRef:
    name: qwen-vectorengine
  replicas: 1
  env:
    - name: AGENT_PROFILE
      value: qwen-vectorengine-minimal
    - name: AGENT_MODE
      value: openai
  service:
    enabled: true
    port: 80
    targetPort: 8080
    type: ClusterIP
