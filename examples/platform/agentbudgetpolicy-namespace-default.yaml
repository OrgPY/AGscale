apiVersion: agscale.io/v1alpha1
kind: AgentBudgetPolicy
metadata:
  name: default-namespace-budget
spec:
  scope: Namespace
  targetRef:
    name: default
  window:
    mode: Rolling24h
  limits:
    maxRequests24h: 200000
    maxTokens24h: 40000000
    maxEstimatedCostUSD24h: 500
  usageSources:
    metrics:
      enabled: true
  evaluation:
    intervalSeconds: 60
    staleAfterSeconds: 300
  alerting:
    emitK8sEvents: true
    setConditions: true
