name: publish-npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.1.4. Defaults to v + npm/package.json version."
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Resolve package version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [[ -z "$TAG" ]]; then
            VERSION="$(node -p "require('./package.json').version")"
            TAG="v${VERSION}"
          else
            VERSION="${TAG#v}"
            git fetch --force --tags
            git checkout "$TAG"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Validate package version matches tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          VERSION="${TAG#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$PACKAGE_VERSION" != "$VERSION" ]]; then
            echo "npm/package.json version ${PACKAGE_VERSION} does not match tag ${VERSION}" >&2
            exit 1
          fi

      - name: Verify package contents
        shell: bash
        run: |
          set -euo pipefail
          test -x bin/agscale.js || { echo "npm/bin/agscale.js missing or not executable" >&2; exit 1; }
          npm pack --dry-run 2>&1 | tee /tmp/npm-pack.txt
          grep -q "bin/agscale.js" /tmp/npm-pack.txt

      - name: Publish
        run: npm publish --access public
