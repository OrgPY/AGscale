name: release-cli

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag or version to publish, e.g. v0.1.4 or 0.1.4. Leave empty to derive from npm/package.json."
        required: false
        type: string
      release_repo:
        description: "GitHub repo that should host public release assets, e.g. OrgPY/agscale-releases."
        required: false
        type: string
      publish_npm:
        description: "Publish the npm wrapper package as part of this manual run."
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      checkout_ref: ${{ steps.release.outputs.checkout_ref }}
      should_release: ${{ steps.release.outputs.should_release }}
      should_publish_npm: ${{ steps.release.outputs.should_publish_npm }}
      release_repo: ${{ steps.release.outputs.release_repo }}
      release_branch: ${{ steps.release.outputs.release_branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Version
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag || '' }}
          INPUT_RELEASE_REPO: ${{ github.event.inputs.release_repo || '' }}
          INPUT_PUBLISH_NPM: ${{ github.event.inputs.publish_npm || 'false' }}
          VAR_RELEASE_REPO: ${{ vars.AGSCALE_PUBLIC_RELEASE_REPO || '' }}
          VAR_RELEASE_BRANCH: ${{ vars.AGSCALE_PUBLIC_RELEASE_BRANCH || '' }}
          VAR_PUBLISH_NPM: ${{ vars.AGSCALE_PUBLISH_NPM || 'false' }}
        run: |
          set -euo pipefail
          git fetch --force --tags

          SHOULD_RELEASE=true
          SHOULD_PUBLISH_NPM=false
          CHECKOUT_REF=""
          RELEASE_REPO="${INPUT_RELEASE_REPO:-${VAR_RELEASE_REPO:-${GITHUB_REPOSITORY}}}"
          RELEASE_BRANCH="${VAR_RELEASE_BRANCH:-main}"

          if [[ ! "${RELEASE_REPO}" =~ ^[^/]+/[^/]+$ ]]; then
            echo "invalid release repo: ${RELEASE_REPO} (expected owner/repo)" >&2
            exit 1
          fi

          if [[ "${VAR_PUBLISH_NPM}" == "true" ]]; then
            SHOULD_PUBLISH_NPM=true
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${INPUT_PUBLISH_NPM}" == "true" ]]; then
              SHOULD_PUBLISH_NPM=true
            else
              SHOULD_PUBLISH_NPM=false
            fi
          fi

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            CHECKOUT_REF="${TAG}"
          elif [[ -n "${INPUT_TAG}" ]]; then
            TAG="${INPUT_TAG}"
            if [[ "${TAG}" != v* ]]; then
              TAG="v${TAG}"
            fi
            VERSION="${TAG#v}"
            CHECKOUT_REF="${TAG}"
            if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "release tag ${TAG} does not exist" >&2
              exit 1
            fi
          else
            VERSION="$(node -p "require('./npm/package.json').version")"
            TAG="v${VERSION}"
            CHECKOUT_REF="${TAG}"
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              SHOULD_RELEASE=false
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "$TAG" -m "Release $TAG"
              git push origin "$TAG"
            fi
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "invalid semver version: $VERSION" >&2
            exit 1
          fi

          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "checkout_ref=${CHECKOUT_REF}"
            echo "should_release=${SHOULD_RELEASE}"
            echo "should_publish_npm=${SHOULD_PUBLISH_NPM}"
            echo "release_repo=${RELEASE_REPO}"
            echo "release_branch=${RELEASE_BRANCH}"
          } >> "$GITHUB_OUTPUT"

  goreleaser:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Release Ref
        run: |
          git fetch --force --tags
          git checkout "${{ needs.prepare.outputs.checkout_ref }}"

      - name: Select Release Token
        env:
          RELEASE_REPO: ${{ needs.prepare.outputs.release_repo }}
          SOURCE_REPO: ${{ github.repository }}
          PUBLIC_RELEASE_TOKEN: ${{ secrets.AGSCALE_PUBLIC_RELEASE_TOKEN }}
          DEFAULT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_REPO}" != "${SOURCE_REPO}" ]]; then
            if [[ -z "${PUBLIC_RELEASE_TOKEN}" ]]; then
              echo "AGSCALE_PUBLIC_RELEASE_TOKEN secret is required to publish to ${RELEASE_REPO}" >&2
              exit 1
            fi
            echo "GORELEASER_GITHUB_TOKEN=${PUBLIC_RELEASE_TOKEN}" >> "$GITHUB_ENV"
          else
            echo "GORELEASER_GITHUB_TOKEN=${DEFAULT_GITHUB_TOKEN}" >> "$GITHUB_ENV"
          fi

      - name: Render GoReleaser Config
        env:
          RELEASE_REPO: ${{ needs.prepare.outputs.release_repo }}
          RELEASE_BRANCH: ${{ needs.prepare.outputs.release_branch }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/agscale-release"
          sed "s|^REPO=.*$|REPO=\"\${AGSCALE_RELEASE_REPO:-\${AGSCALE_REPO:-${RELEASE_REPO}}}\"|" hack/install-cli.sh > "${RUNNER_TEMP}/agscale-release/install-cli.sh"
          chmod +x "${RUNNER_TEMP}/agscale-release/install-cli.sh"
          OWNER="${RELEASE_REPO%%/*}"
          NAME="${RELEASE_REPO#*/}"
          awk '
            {
              if (skip && $0 ~ /^[^[:space:]]/) {
                skip=0
              }
              if ($0 ~ /^before:$/) {
                skip=1
                next
              }
              if (!skip) {
                print
              }
            }
          ' .goreleaser-cli.yaml > "${RUNNER_TEMP}/agscale-release/goreleaser.yaml"
          {
            printf 'before:\n'
            printf '  hooks:\n'
            printf '    - go mod tidy\n'
            printf "    - sh -c 'mkdir -p dist && cp \"%s\" dist/install-cli.sh && chmod +x dist/install-cli.sh'\n" "${RUNNER_TEMP}/agscale-release/install-cli.sh"
            printf 'release:\n'
            printf '  github:\n'
            printf '    owner: %s\n' "${OWNER}"
            printf '    name: %s\n' "${NAME}"
            printf '  prerelease: auto\n'
            printf '  mode: replace\n'
            printf '  replace_existing_artifacts: true\n'
            printf '  target_commitish: %s\n' "${RELEASE_BRANCH}"
            printf '  extra_files:\n'
            printf '    - glob: dist/install-cli.sh\n'
          } >> "${RUNNER_TEMP}/agscale-release/goreleaser.yaml"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser (CLI only)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --config "${{ runner.temp }}/agscale-release/goreleaser.yaml"
        env:
          GITHUB_TOKEN: ${{ env.GORELEASER_GITHUB_TOKEN }}

  npm:
    needs:
      - prepare
      - goreleaser
    if: needs.prepare.outputs.should_release == 'true' && needs.prepare.outputs.should_publish_npm == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Release Ref
        working-directory: .
        run: |
          git fetch --force --tags
          git checkout "${{ needs.prepare.outputs.checkout_ref }}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Validate package version matches tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.tag }}"
          VERSION="${TAG#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$PACKAGE_VERSION" != "$VERSION" ]]; then
            echo "npm/package.json version ${PACKAGE_VERSION} does not match release tag ${VERSION}" >&2
            exit 1
          fi

      - name: Publish
        run: npm publish --access public
