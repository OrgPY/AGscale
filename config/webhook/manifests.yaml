apiVersion: v1
kind: Service
metadata:
  name: agscale-webhook-service
  namespace: agscale-system
spec:
  selector:
    app: agscale-controller-manager
  ports:
    - port: 443
      targetPort: webhook
      protocol: TCP
      name: https
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: agscale-mutating-webhook-configuration
webhooks:
  - name: magent.agscale.io
    sideEffects: None
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        namespace: agscale-system
        name: agscale-webhook-service
        path: /mutate-agscale-io-v1alpha1-agent
      caBundle: Cg==
    rules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: ["agscale.io"]
        apiVersions: ["v1alpha1"]
        resources: ["agents"]
  - name: magentbudgetpolicy.agscale.io
    sideEffects: None
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        namespace: agscale-system
        name: agscale-webhook-service
        path: /mutate-agscale-io-v1alpha1-agentbudgetpolicy
      caBundle: Cg==
    rules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: ["agscale.io"]
        apiVersions: ["v1alpha1"]
        resources: ["agentbudgetpolicies"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: agscale-validating-webhook-configuration
webhooks:
  - name: vagent.agscale.io
    sideEffects: None
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        namespace: agscale-system
        name: agscale-webhook-service
        path: /validate-agscale-io-v1alpha1-agent
      caBundle: Cg==
    rules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: ["agscale.io"]
        apiVersions: ["v1alpha1"]
        resources: ["agents"]
  - name: vagentbudgetpolicy.agscale.io
    sideEffects: None
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        namespace: agscale-system
        name: agscale-webhook-service
        path: /validate-agscale-io-v1alpha1-agentbudgetpolicy
      caBundle: Cg==
    rules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: ["agscale.io"]
        apiVersions: ["v1alpha1"]
        resources: ["agentbudgetpolicies"]
