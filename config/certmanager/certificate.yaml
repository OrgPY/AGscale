apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: agscale-serving-cert
  namespace: agscale-system
spec:
  dnsNames:
    - agscale-webhook-service.agscale-system.svc
    - agscale-webhook-service.agscale-system.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: agscale-selfsigned-issuer
  secretName: agscale-webhook-server-cert
