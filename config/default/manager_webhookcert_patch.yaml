apiVersion: apps/v1
kind: Deployment
metadata:
  name: agscale-controller-manager
  namespace: agscale-system
spec:
  template:
    spec:
      containers:
        - name: manager
          volumeMounts:
            - mountPath: /tmp/k8s-webhook-server/serving-certs
              name: cert
              readOnly: true
      volumes:
        - name: cert
          secret:
            secretName: agscale-webhook-server-cert
