apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agscale-system
resources:
  - ../crd
  - ../rbac
  - ../manager
  - ../webhook
  - ../certmanager
patches:
  - path: mutating_webhookcainjection_patch.yaml
    target:
      kind: MutatingWebhookConfiguration
      name: agscale-mutating-webhook-configuration
  - path: validating_webhookcainjection_patch.yaml
    target:
      kind: ValidatingWebhookConfiguration
      name: agscale-validating-webhook-configuration
  - path: manager_webhookcert_patch.yaml
    target:
      kind: Deployment
      name: agscale-controller-manager
