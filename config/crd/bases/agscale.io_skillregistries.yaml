apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: skillregistries.agscale.io
spec:
  group: agscale.io
  scope: Namespaced
  names:
    plural: skillregistries
    singular: skillregistry
    kind: SkillRegistry
    shortNames:
      - sr
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                protocol:
                  type: string
                  enum:
                    - mcp
                    - openapi-http
                baseURL:
                  type: string
                auth:
                  type: object
                  properties:
                    name:
                      type: string
                    key:
                      type: string
                tls:
                  type: object
                  properties:
                    insecureSkipVerify:
                      type: boolean
                    caSecretRef:
                      type: object
                      properties:
                        name:
                          type: string
                sync:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    intervalSeconds:
                      type: integer
                rateLimit:
                  type: object
                  properties:
                    qps:
                      type: integer
                    burst:
                      type: integer
                filters:
                  type: object
                  properties:
                    includeTags:
                      type: array
                      items:
                        type: string
                    excludeTags:
                      type: array
                      items:
                        type: string
                    nameRegex:
                      type: string
                openapi:
                  type: object
                  properties:
                    listPath:
                      type: string
                    getPathTemplate:
                      type: string
                    mapping:
                      type: object
                      additionalProperties:
                        type: string
                mcp:
                  type: object
                  properties:
                    transport:
                      type: string
                    serverId:
                      type: string
                    toolsPath:
                      type: string
                    resourcesPath:
                      type: string
                    templatesPath:
                      type: string
                    capabilityMapping:
                      type: object
                      additionalProperties:
                        type: string
              required:
                - protocol
                - baseURL
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                lastSyncTime:
                  type: string
                  format: date-time
                lastError:
                  type: string
                discoveredCount:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Protocol
          type: string
          jsonPath: .spec.protocol
        - name: BaseURL
          type: string
          jsonPath: .spec.baseURL
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
