apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentworkflowruns.agscale.io
spec:
  group: agscale.io
  scope: Namespaced
  names:
    plural: agentworkflowruns
    singular: agentworkflowrun
    kind: AgentWorkflowRun
    shortNames:
      - awr
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                workflowRef:
                  type: object
                  properties:
                    name:
                      type: string
                trigger:
                  type: string
                inputRef:
                  type: object
                  properties:
                    name:
                      type: string
                correlationID:
                  type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                phase:
                  type: string
                startedAt:
                  type: string
                  format: date-time
                completedAt:
                  type: string
                  format: date-time
                stepResults:
                  type: array
                  items:
                    type: object
                    properties:
                      stepName:
                        type: string
                      durationMs:
                        type: integer
                      status:
                        type: string
                      error:
                        type: string
                outputRef:
                  type: object
                  properties:
                    name:
                      type: string
                policyDecisions:
                  type: array
                  items:
                    type: object
                    properties:
                      policy:
                        type: string
                      result:
                        type: string
                      reason:
                        type: string
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Workflow
          type: string
          jsonPath: .spec.workflowRef.name
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
