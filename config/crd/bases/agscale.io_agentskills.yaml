apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentskills.agscale.io
spec:
  group: agscale.io
  scope: Namespaced
  names:
    plural: agentskills
    singular: agentskill
    kind: AgentSkill
    shortNames:
      - skill
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                type:
                  type: string
                description:
                  type: string
                endpoint:
                  type: string
                authSecretRef:
                  type: object
                  properties:
                    name:
                      type: string
                    key:
                      type: string
                config:
                  type: object
                  additionalProperties:
                    type: string
                source:
                  type: object
                  properties:
                    protocol:
                      type: string
                      enum:
                        - mcp
                        - openapi-http
                    url:
                      type: string
                    externalID:
                      type: string
                    authSecretRef:
                      type: object
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                  required:
                    - protocol
                    - url
                syncPolicy:
                  type: object
                  properties:
                    mode:
                      type: string
                      enum:
                        - Snapshot
                        - TrackLatest
                    intervalSeconds:
                      type: integer
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                sourceResolved:
                  type: boolean
                resolvedVersion:
                  type: string
                lastResolvedAt:
                  type: string
                  format: date-time
                lastError:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: .spec.type
        - name: Endpoint
          type: string
          jsonPath: .spec.endpoint
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
